# Trial 528 finished with value: 0.8324873096446701 and parameters: {'sampling_strategy': 'geomean', 'initial_base_lr': 0.005, 'initial_head_lr': 0.0005, 'lr_decay_factor': 1.25, 'weight_decay': 0.0001, 'head_hidden_dim': 64, 'phase1_ratio_shared': 0.5741563169855165, 'epochs_iter1': 1}.


# Training parameters
num_iterations: 3
epochs_per_iteration: [3, 50, 50]
batch_size: 64
seed: 42

# Model architecture
backbone: lenet4
pretrained: false
head_type: linear
head_hidden_dim: 8
head_dropout: 0
split_node_head_type: true

# Learning rates
initial_base_lr: 0.005
initial_head_lr: 0.0005
lr_decay_factor: 1.5

# Optimizer configuration
optimizer:
    type: adamw
    weight_decay: 0.1

# Scheduler configuration
scheduler:
    type: plateau
    factor: 0.1
    patience: 5
    eta_min: 1.0e-06

# Loss and regularization
use_class_weights: true
skip_class_weights_iter1: true
max_class_weight: 20.0
regularization_type: l2
aux_loss_weight: 1
min_samples_per_node: 20
sampling_strategy: geomean

# Training phases
phase1_epochs_ratio: [0, 0.5, 0.5]
phase1_patience: 10
phase2_patience: 15
early_stopping: true
model_selection_criterion: iter2_wga
depth_selection_enabled: true
depth_selection_confidence: 1.96   # optional, this is the default

# Routing strategy
routing_strategy: correctness
hierarchical_architecture: correct_label_routing

# Data parameters
image_size: 32
num_channels: 1
num_workers: 4
pin_memory: true

# Logging
log_attributions: true
log_epoch_metrics: true
verbose: 2

# Wandb configuration
wandb_enabled: true
wandb_project: nct-umnist
wandb_entity: ankurgarg-university-of-calgary-in-alberta
wandb_tags: [umnist, optuna-best]

# Checkpoint settings
save_iteration_checkpoints: true
checkpoint_dir: ./checkpoints
attribution_dir: ./attributions
