# ERM Baseline Configuration for CelebA Dataset (Blond Hair)
# Simple baseline without hierarchical training
# Consistent structure with Waterbird presets

# Training parameters
num_iterations: 1
epochs_per_iteration: [50]
batch_size: 128
seed: 42

# Model architecture
backbone: resnet50
pretrained: true
head_hidden_dim: 256
head_dropout: 0.3

# Learning rates
initial_base_lr: 1.0e-05
initial_head_lr: 1.0e-05
lr_decay_factor: 1.0

# Optimizer configuration
optimizer:
    type: adamw
    weight_decay: 0.1
    betas: [0.9, 0.999]
    eps: 1.0e-08

# Scheduler configuration
scheduler:
    type: plateau
    patience: 5
    factor: 0.5
    eta_min: 1.0e-06

# Loss and regularization
use_class_weights: true
regularization_type: l2
lambda_l1: 0.0
aux_loss_weight: 0.0

# Training phases
phase1_epochs_ratio: [0.5]
phase1_patience: 8
phase2_patience: 8
early_stopping: true
model_selection_criterion: auto

# Routing strategy
routing_strategy: correctness
hierarchical_architecture: none
node_balanced_sampling: false

# Data parameters
image_size: 224
num_workers: 8
pin_memory: true

# Logging
log_attributions: false
log_epoch_metrics: true
verbose: 2

# Wandb configuration
wandb_enabled: true
wandb_project: nct-celeba
wandb_entity: ankurgarg-university-of-calgary-in-alberta
wandb_tags: [arc, celeba, baseline, erm]

# Checkpoint settings
save_iteration_checkpoints: true
checkpoint_dir: ./checkpoints
attribution_dir: ./attributions
