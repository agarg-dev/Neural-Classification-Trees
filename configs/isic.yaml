# NCT configuration for ISIC

num_iterations: 3
epochs_per_iteration: [1, 50, 50]
batch_size: 256
seed: 42

backbone: resnet50
pretrained: true
head_batch_norm: false
head_bn_affine: false
split_node_head_type: true
head_hidden_dim: 96
head_dropout: 0.2

initial_base_lr: 0.008884875869294623
initial_head_lr: 0.008814188849906928
lr_decay_factor: 3.0

optimizer:
  betas:
  - 0.9
  - 0.999
  nesterov: false
  type: sgd
  weight_decay: 6.3264826260005775e-06

scheduler:
  gamma: 0.1
  step_size: 15
  type: step

use_class_weights: true
max_class_weight: 20.0
min_samples_per_node: 0
regularization_type: elastic_net
lambda_l1: 0.001
aux_loss_weight: 2.0

phase1_epochs_ratio: [1, 0.6000000000000001, 0.1]
phase1_patience: 15
phase2_patience: 15
early_stopping: true
model_selection_criterion: iter2_auroc
depth_selection_enabled: true
depth_selection_confidence: 1.96

routing_strategy: correctness
hierarchical_architecture: correct_label_routing

image_size: 224
num_workers: 16
pin_memory: true
cache_images_in_memory: false

log_attributions: true
log_epoch_metrics: true
verbose: 2

wandb_enabled: false
wandb_project: nct-isic
wandb_tags: [isic]

save_iteration_checkpoints: true
checkpoint_dir: ./checkpoints
attribution_dir: ./attributions
