# ERM Baseline Configuration for Waterbird Dataset
# Simple baseline without hierarchical training

# Training parameters
num_iterations: 1
epochs_per_iteration: [100]
batch_size: 64
seed: 42

# Model architecture
backbone: resnet50
pretrained: true
head_hidden_dim: 256
head_dropout: 0.3

# Learning rates
initial_base_lr: 1.0e-04
initial_head_lr: 1.0e-03
lr_decay_factor: 1.0

# Optimizer configuration
optimizer:
  type: adamw
  weight_decay: 1.0e-04
  betas: [0.9, 0.999]

# Scheduler configuration
scheduler:
  type: plateau
  patience: 5
  factor: 0.5

# Loss and regularization
use_class_weights: true
regularization_type: l2
lambda_l1: 0.0
aux_loss_weight: 0.0

# Training phases
phase1_epochs_ratio: [0.5]
phase1_patience: 10
phase2_patience: 10
early_stopping: true

# Routing strategy
routing_strategy: argmax
confidence_threshold: 0.7
hierarchical_architecture: none

# Data parameters
image_size: 224
num_workers: 8
pin_memory: true

# Logging
log_attributions: false
log_epoch_metrics: true
verbose: 2

# Wandb configuration
wandb_enabled: true
wandb_project: nct-waterbirds
wandb_entity: ankurgarg-university-of-calgary-in-alberta
wandb_tags: [arc, waterbirds, baseline, erm]

# Checkpoint settings
save_iteration_checkpoints: true
checkpoint_dir: ./checkpoints
