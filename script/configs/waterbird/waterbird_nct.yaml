# NCT Configuration for Waterbird Dataset
# Proven best configuration

# Training parameters
num_iterations: 3
epochs_per_iteration: [100, 100, 100]
batch_size: 64
seed: 42

# Model architecture
backbone: resnet50
pretrained: true
head_hidden_dim: 256
head_dropout: 0.3

# Learning rates
initial_base_lr: 8.0e-06
initial_head_lr: 8.0e-06
lr_decay_factor: 2.0

# Optimizer configuration
optimizer:
    type: adamw
    weight_decay: 1.0
    betas: [0.9, 0.999]
    eps: 1.0e-08

# Scheduler configuration
scheduler:
    type: plateau
    patience: 3
    factor: 0.5

# Loss and regularization
use_class_weights: true
max_class_weight: 20.0 # Cap class weights to prevent extreme imbalance effects
regularization_type: l2
lambda_l1: 1.0e-05
aux_loss_weight: 0.6

# Training phases
phase1_epochs_ratio: [1.0, 0.5, 0.5]
phase1_patience: 15
phase2_patience: 5
early_stopping: true

# Routing strategy
routing_strategy: correctness
hierarchical_architecture: correct_label_routing

# Data parameters
image_size: 224
num_workers: 8
pin_memory: true

# Logging
log_attributions: true
log_epoch_metrics: true
verbose: 2

# Wandb configuration
wandb_enabled: true
wandb_project: nct-waterbirds
wandb_entity: ankurgarg-university-of-calgary-in-alberta
wandb_tags: [arc, waterbirds, resnet50]

# Checkpoint settings
save_iteration_checkpoints: true
checkpoint_dir: ./checkpoints
attribution_dir: ./attributions
