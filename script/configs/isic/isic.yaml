# NCT Configuration for ISIC Dataset
# Using George paper's recommended hyperparameters for ISIC
# Reference: https://github.com/HazyResearch/hidden-stratification

# Training parameters
num_iterations: 3
epochs_per_iteration: [1, 50, 50]
batch_size: 256
seed: 42

# Model architecture
backbone: resnet50
pretrained: true
head_hidden_dim: 96
head_dropout: 0
head_type: mlp
split_node_head_type: true

# Learning rates (George paper uses 0.001 for SGD)
# initial_base_lr: 5.0e-05
# initial_head_lr: 8.0e-06
initial_base_lr: 8.0e-05
initial_head_lr: 0.0001
lr_decay_factor: 2.5

# Optimizer configuration (George paper uses SGD)
optimizer:
    type: adamw
    weight_decay: 0.1
    betas: [0.9, 0.999]

# Scheduler configuration (George paper uses MultiStepLR with milestone at 15)
scheduler:
    type: step
    step_size: 15
    gamma: 0.1

# Loss and regularization
use_class_weights: true
max_class_weight: 20.0
regularization_type: elastic_net
lambda_l1: 0.001
aux_loss_weight: 1

# Training phases
# George paper trains end-to-end, so we use phase1_epochs_ratio of 0.0
# to skip phase 1 (frozen backbone) and go straight to full fine-tuning
phase1_epochs_ratio: [1, 0.5, 0.5]
phase1_patience: 15
phase2_patience: 15
early_stopping: true
model_selection_criterion: iter2_auroc
depth_selection_enabled: true
depth_selection_confidence: 1.96   # optional, this is the default

# Routing strategy
routing_strategy: correctness
hierarchical_architecture: correct_label_routing

# Data parameters
image_size: 224
num_workers: 16
pin_memory: true
cache_images_in_memory: false

# Logging
log_attributions: true
log_epoch_metrics: true
verbose: 2

# Wandb configuration
wandb_enabled: true
wandb_project: nct-isic
wandb_entity: ankurgarg-university-of-calgary-in-alberta
wandb_tags: [arc, isic, resnet50, george-params]

# Checkpoint settings
save_iteration_checkpoints: true
checkpoint_dir: ./checkpoints
attribution_dir: ./attributions

