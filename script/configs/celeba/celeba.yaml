# NCT Configuration for CelebA Dataset - DFR-style
# Based on: celeba_nct.yaml



# Training parameters
num_iterations: 3
epochs_per_iteration: [1 , 50, 50]
batch_size: 64
seed: 42

# Model architecture
backbone: resnet50
pretrained: true
head_hidden_dim: 128
head_dropout: 0.3
head_type: mlp
split_node_head_type: true

# Learning rates
initial_base_lr: 1.0e-05
initial_head_lr: 0.0001
lr_decay_factor: 1.5

# Optimizer configuration
# optimizer:
#     type: adamw
#     weight_decay: 0.1
#     betas: [0.9, 0.999]
#     eps: 1.0e-08

optimizer:
    type: sgd
    weight_decay: 0.1
    momentum: 0.9
    nesterov: false


# Scheduler configuration
scheduler:
    type: plateau
    patience: 10
    factor: 0.5
    eta_min: 1.0e-06

# Loss and regularization
sampling_strategy: downsample
use_class_weights: true
skip_class_weights_iter1: false
max_class_weight: 20.0
min_samples_per_node: 10
regularization_type: l2
lambda_l1: 0.0
aux_loss_weight: 2

# Training phases
phase1_epochs_ratio: [1, 0.3, 0.3]
phase1_patience: 15
phase2_patience: 15
early_stopping: true
model_selection_criterion: iter2_wga

# Routing strategy
routing_strategy: correctness
hierarchical_architecture: correct_label_routing

# Data parameters
image_size: 224
num_workers: 8
pin_memory: true

# Logging
log_attributions: true
log_epoch_metrics: true
verbose: 2

# Wandb configuration
wandb_enabled: true
wandb_project: nct-celeba
wandb_entity: ankurgarg-university-of-calgary-in-alberta
wandb_tags: [arc, celeba, dfr]

# Checkpoint settings
save_iteration_checkpoints: true
checkpoint_dir: ./checkpoints
attribution_dir: ./attributions
