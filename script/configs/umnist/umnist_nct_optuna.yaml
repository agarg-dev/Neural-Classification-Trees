# NCT Configuration for UMNIST Dataset
# Hyperparameters found by Optuna

# Training parameters
num_iterations: 2
epochs_per_iteration: [100, 100]
batch_size: 128
seed: 42

# Model architecture
backbone: lenet5
pretrained: false
head_hidden_dim: 64
head_dropout: 0.2

# Learning rates
initial_base_lr: 0.005
initial_head_lr: 0.0001
lr_decay_factor: 4.0

# Optimizer configuration
optimizer:
    type: adamw
    weight_decay: 1.0e-06
    betas: [0.9, 0.999]
    eps: 1.0e-08

# Scheduler configuration
scheduler:
    type: plateau
    patience: 5
    factor: 0.5

# Loss and regularization
use_class_weights: true
max_class_weight: 40.0
regularization_type: elastic_net
lambda_l1: 0.001
aux_loss_weight: 0.2

# Training phases
phase1_epochs_ratio: [0.3, 0.7]
phase1_patience: 10
phase2_patience: 5

# Routing strategy
routing_strategy: correctness
hierarchical_architecture: correct_label_routing

# Data parameters
image_size: 28
num_workers: 4
pin_memory: true

# Logging
log_attributions: true
log_epoch_metrics: true
verbose: 2

# Wandb configuration
wandb_enabled: true
wandb_project: nct-umnist
wandb_entity: ankurgarg-university-of-calgary-in-alberta
wandb_tags: [arc, umnist, lenet5, optuna]

# Checkpoint settings
save_iteration_checkpoints: true
checkpoint_dir: ./checkpoints
attribution_dir: ./attributions

