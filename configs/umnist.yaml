# NCT configuration for UMNIST (Undersampled MNIST, LeNet-4 backbone)

num_iterations: 3
epochs_per_iteration: [5, 50, 50]
batch_size: 128
seed: 42

backbone: lenet4
pretrained: false
num_channels: 1
head_hidden_dim: 64
head_dropout: 0.2
head_type: linear
split_node_head_type: true

initial_base_lr: 2.0e-03
initial_head_lr: 1.0e-04
lr_decay_factor: 1.0

optimizer:
  type: adamw
  weight_decay: 5.0e-03

scheduler:
  type: plateau
  patience: 5
  factor: 0.5

use_class_weights: true
skip_class_weights_iter1: true
max_class_weight: 20.0
regularization_type: l2
lambda_l1: 1.0e-05
aux_loss_weight: 0.5
sampling_strategy: geomean

phase1_epochs_ratio: [0, 0.5, 0.5]
phase1_patience: 10
phase2_patience: 5
early_stopping: true
model_selection_criterion: iter2_wga
depth_selection_enabled: true
depth_selection_confidence: 1.96

routing_strategy: correctness
hierarchical_architecture: correct_label_routing

image_size: 32
num_workers: 4
pin_memory: true

log_attributions: true
log_epoch_metrics: true
verbose: 2

wandb_enabled: false
wandb_project: nct-umnist
wandb_tags: [umnist, lenet]

save_iteration_checkpoints: true
checkpoint_dir: ./checkpoints
attribution_dir: ./attributions
