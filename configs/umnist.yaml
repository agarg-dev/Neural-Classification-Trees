# NCT Configuration for UMNIST Dataset
#
# Key differences from RGB datasets:
# - Uses LeNet-5 backbone (no pretrained weights, grayscale input)
# - Higher learning rates (no pretrained features to preserve)
# - Lower weight decay (smaller model needs less regularization)
# - Smaller head dimensions (LeNet outputs 84 features vs ResNet's 2048)

# Training parameters
num_iterations: 3
epochs_per_iteration: [1, 50, 50]
batch_size: 128
seed: 42

# Model architecture - LeNet-5 for MNIST-like datasets
backbone: lenet5
pretrained: false
num_channels: 1
head_type: linear
head_hidden_dim: 32
head_dropout: 0.3

# Learning rates (higher since training from scratch)
initial_base_lr: 0.001
initial_head_lr: 0.005
lr_decay_factor: 2.0

# Optimizer configuration
optimizer:
    type: adam
    weight_decay: 5.0e-04
    betas: [0.9, 0.999]
    eps: 1.0e-08

# Scheduler configuration
scheduler:
    type: plateau
    patience: 5
    factor: 0.5

# Loss and regularization
use_class_weights: true
max_class_weight: 20.0
regularization_type: l2
lambda_l1: 1.0e-05
aux_loss_weight: 1

# Training phases
phase1_epochs_ratio: [1, 1, 1]
phase1_patience: 10
phase2_patience: 10
early_stopping: true
model_selection_criterion: auto

# Routing strategy
routing_strategy: correctness
hierarchical_architecture: correct_label_routing

# Data parameters
image_size: 28
num_workers: 4
pin_memory: true

# Logging
log_attributions: true
log_epoch_metrics: true
verbose: 2

# Wandb configuration
wandb_enabled: false
wandb_project: nct
wandb_tags: [umnist, lenet5]

# Checkpoint settings
save_iteration_checkpoints: true
checkpoint_dir: ./checkpoints
attribution_dir: ./attributions
