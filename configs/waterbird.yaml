# NCT configuration for Waterbird

num_iterations: 3
epochs_per_iteration: [1, 100, 100]
batch_size: 128
seed: 42

backbone: resnet50
pretrained: true
head_type: mlp
head_bn_affine: true
head_hidden_dim: 32
head_dropout: 0.3
split_node_head_type: true

initial_base_lr: 2.7e-05
initial_head_lr: 1.3e-05
lr_decay_factor: 2.5

optimizer:
    type: adamw
    weight_decay: 0.0024

scheduler:
    type: plateau
    factor: 0.1
    patience: 10
    eta_min: 1.0e-06

sampling_strategy: none
use_class_weights: true
skip_class_weights_iter1: true
max_class_weight: 40.0
regularization_type: l2
aux_loss_weight: 1.0
min_samples_per_node: 20

phase1_epochs_ratio: [0.0, 0.3, 0.3]
phase1_patience: 10
phase2_patience: 15
early_stopping: true
model_selection_criterion: iter2_wga
depth_selection_enabled: true
depth_selection_confidence: 1.96

routing_strategy: correctness
hierarchical_architecture: correct_label_routing

image_size: 224
num_workers: 8
num_channels: 3
pin_memory: true

log_attributions: true
log_epoch_metrics: true
verbose: 2

wandb_enabled: false
wandb_project: nct-waterbirds
wandb_tags: [waterbirds]

save_iteration_checkpoints: true
checkpoint_dir: ./checkpoints
attribution_dir: ./attributions
