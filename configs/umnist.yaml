# NCT configuration for UMNIST (Undersampled MNIST, LeNet-4 backbone)

num_iterations: 3
epochs_per_iteration: [3, 50, 50]
batch_size: 64
seed: 42

backbone: lenet4
pretrained: false
head_batch_norm: true
head_bn_affine: false
num_channels: 1
head_hidden_dim: 64
head_dropout: 0.0
head_type: linear
split_node_head_type: true

initial_base_lr: 0.0010048853540716473
initial_head_lr: 0.0007072719274589292
lr_decay_factor: 3.0

optimizer:
  nesterov: false
  type: sgd
  weight_decay: 0.0754073758787582

scheduler:
  eta_min: 1.0e-06
  factor: 0.1
  patience: 5
  type: plateau

use_class_weights: true
skip_class_weights_iter1: true
max_class_weight: 20.0
regularization_type: l2
aux_loss_weight: 1.0
min_samples_per_node: 20
sampling_strategy: geomean

phase1_epochs_ratio: [0, 0.30000000000000004, 0.0]
phase1_patience: 10
phase2_patience: 15
early_stopping: true
model_selection_criterion: iter2_wga
depth_selection_enabled: true
depth_selection_confidence: 1.96

routing_strategy: correctness
hierarchical_architecture: correct_label_routing

image_size: 32
num_workers: 4
pin_memory: true

log_attributions: true
log_epoch_metrics: true
verbose: 2

wandb_enabled: false
wandb_project: nct-umnist
wandb_tags: [umnist, lenet]

save_iteration_checkpoints: true
checkpoint_dir: ./checkpoints
attribution_dir: ./attributions
