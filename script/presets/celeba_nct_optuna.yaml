# NCT Configuration for CelebA Dataset (Blond Hair)
# Consistent structure with Waterbird presets

# Training parameters
num_iterations: 3
epochs_per_iteration: [100, 100, 100]
batch_size: 128
seed: 42

# Model architecture
backbone: resnet50
pretrained: true
head_hidden_dim: 64
head_dropout: 0

# Learning rates
initial_base_lr: 1.0e-06
initial_head_lr: 5.0e-05
lr_decay_factor: 1.25

# Optimizer configuration
optimizer:
    type: adamw
    weight_decay: 0.1
    betas: [0.9, 0.999]
    eps: 1.0e-08

# Scheduler configuration
scheduler:
    type: plateau
    patience: 5
    factor: 0.5
    eta_min: 1.0e-06

# Loss and regularization
use_class_weights: true
max_class_weight: 20.0 # Cap class weights to prevent extreme imbalance effects
regularization_type: l2
lambda_l1: 0.01
aux_loss_weight: 0.5

# Training phases
phase1_epochs_ratio: [1.0, 0.25, 0.4]
phase1_patience: 8
phase2_patience: 8
early_stopping: true
model_selection_criterion: auto

# Routing strategy
routing_strategy: correctness
hierarchical_architecture: correct_label_routing
node_balanced_sampling: false

# Data parameters
image_size: 224
num_workers: 8
pin_memory: true

# Logging
log_attributions: true
log_epoch_metrics: true
verbose: 2

# Wandb configuration
wandb_enabled: true
wandb_project: nct-celeba
wandb_entity: ankurgarg-university-of-calgary-in-alberta
wandb_tags: [arc, celeba, blond-hair, resnet50]

# Checkpoint settings
save_iteration_checkpoints: true
checkpoint_dir: ./checkpoints
attribution_dir: ./attributions
