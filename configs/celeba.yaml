# NCT configuration for CelebA

num_iterations: 3
epochs_per_iteration: [1, 50, 50]
batch_size: 64
seed: 42

backbone: resnet50
pretrained: true
head_batch_norm: true
head_hidden_dim: 256
head_dropout: 0.1
head_type: mlp
head_bn_affine: false
split_node_head_type: true

initial_base_lr: 0.0028304613600382937
initial_head_lr: 1.3582207099691412e-05
lr_decay_factor: 4.0

optimizer:
  momentum: 0.9
  nesterov: false
  type: sgd
  weight_decay: 0.00019226274670973095

scheduler:
  eta_min: 1.0e-06
  factor: 0.5
  patience: 10
  type: plateau

sampling_strategy: downsample
use_class_weights: true
skip_class_weights_iter1: false
max_class_weight: 20.0
min_samples_per_node: 10
regularization_type: l2
lambda_l1: 0.0
aux_loss_weight: 0.25

phase1_epochs_ratio: [1, 0.6000000000000001, 0.5]
phase1_patience: 15
phase2_patience: 15
early_stopping: true
model_selection_criterion: iter2_wga
depth_selection_enabled: true
depth_selection_confidence: 1.96

routing_strategy: correctness
hierarchical_architecture: correct_label_routing

image_size: 224
num_workers: 8
pin_memory: true

log_attributions: true
log_epoch_metrics: true
verbose: 2

wandb_enabled: false
wandb_project: nct-celeba
wandb_tags: [celeba]

save_iteration_checkpoints: true
checkpoint_dir: ./checkpoints
attribution_dir: ./attributions
